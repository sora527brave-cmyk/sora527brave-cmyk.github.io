    <header>
        <h1>恋バナ掲示板</h1>
    </header>

    <main>

        <section class="koibana-form">

            <h2>POST</h2>

            <p>name</p>

            <input
                type="text"
                id="name"
                placeholder="匿名"
            >

            <p>恋バナ</p>

            <textarea
                id="content"
                placeholder="ここに恋バナを書いてください"
            ></textarea>

            <br>

            <button id="post-button">
                投稿する
            </button>

        </section>


        <section class="koibana-posts">

            <h2>POSTS</h2>

            <div id="posts">
                読み込み中...
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="koibana.js"></script>
