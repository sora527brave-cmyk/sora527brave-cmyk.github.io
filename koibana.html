        <h1>恋バナ掲示板</h1>

    <!-- メイン -->

    <main>

        <!-- ルール -->

        <section class="koibana-rules">

    <p>・ここは恋バナを自由に書き込む掲示板です。</p>

    <p>・名前はこのサイトだけのものにしてください。<br>
    思いつかなければ「匿名」で構いません。</p>

    <p>・誰かの名前を書くときはランダムなイニシャルや、<br>
    代名詞などで特定されないようにしてください。</p>

    <p>・攻撃的、加害的、過度に性的な表現は控え、<br>
    見た人が気分を害さないように気を付けてください。</p>

</section>


        <!-- 投稿フォーム -->

        <section class="koibana-form">

            <h2>POST</h2>

            <p>name</p>

            <input
                type="text"
                id="name"
                placeholder="匿名"
            >

            <p>恋バナ</p>

            <textarea
                id="content"
                placeholder="ここに恋バナを書いてください"
            ></textarea>

            <br>

            <button id="post-button">
                投稿する
            </button>

        </section>


        <!-- 投稿一覧 -->

        <section class="koibana-posts">

            <h2>POSTS</h2>

            <div id="posts">
                読み込み中...
            </div>

        </section>

    </main>
